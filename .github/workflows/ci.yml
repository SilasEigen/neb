name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt
          rustup default 1.99.1
      - name: Spec constants against the C header
        run: bash pow/tests/check_spec_constants.sh
      - name: C reference build
        run: |
          for f in shares chacha8 blake3_min; do
            gcc -O2 -Wall -Wextra -Werror -Ipow/ref -c pow/ref/$f.c -o /tmp/$f.o
          done
      - name: Python oracle self test
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet numpy
          /tmp/venv/bin/python -B -I pow/oracle/shares_oracle.py --selftest
      - name: Share vectors, C reference and Python oracle
        run: PATH=/tmp/venv/bin:$PATH bash pow/tests/check_share_vectors.sh
      - name: AVX-512 engine against the C reference (skips without AVX-512)
        run: bash pow/tests/check_avx512.sh
      - name: Chains replayed by the independent Python oracle
        run: |
          for c in synthetic-stress pools-synthetic; do
            PATH=/tmp/venv/bin:$PATH python3 -B -I pow/oracle/chain_oracle.py pow/tests/chains/$c.txt
          done
      - name: Rust formatting
        run: cargo fmt --manifest-path node/Cargo.toml --all --check
      - name: Clippy, warnings as errors
        run: cargo clippy --locked --manifest-path node/Cargo.toml --workspace --all-targets -- -D warnings
      - name: Node tests
        run: cargo test --locked --manifest-path node/Cargo.toml
      - name: Chain fixtures replayed with the functions of the node
        run: |
          for c in synthetic-stress pools-synthetic; do
            cargo run --locked --release --quiet --manifest-path node/Cargo.toml -p neb-chain --example chain_fixture -- replay pow/tests/chains/$c.txt
          done
      - name: The node does not depend on the optimised engines
        run: |
          if cargo tree --locked --manifest-path node/Cargo.toml -p neb-node -e normal | grep -q neb-engines; then
            echo "neb-node depends on neb-engines"; exit 1
          fi
      - name: Node self tests
        run: |
          for t in --selftest --shares-selftest --chain-selftest --work-selftest; do
            cargo run --locked --quiet --manifest-path node/Cargo.toml --bin neb-node -- $t
          done

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compose file
        run: NEB_MINER_ADDRESS=neb1example docker compose config --quiet
      - name: Node and CPU miner images
        run: |
          docker build --target node -t neb-node:ci .
          docker build --target miner-cpu -t neb-miner-cpu:ci .
      - name: The node image runs as an unprivileged user and passes its self tests
        run: |
          test "$(docker run --rm --entrypoint id neb-node:ci -u)" = 10001
          for t in --selftest --shares-selftest --chain-selftest --work-selftest; do
            docker run --rm neb-node:ci neb-node $t
          done
      - name: The node image refuses to start without the dataset file
        run: |
          if docker run --rm -e NEB_MINER_ADDRESS=neb1example neb-node:ci; then
            echo "the node started without a dataset file"; exit 1
          fi

  docker-cuda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: GPU miner image
        run: docker build -f Dockerfile.cuda -t neb-miner-gpu:ci .

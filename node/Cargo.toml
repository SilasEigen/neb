# Workspace of the node. neb-pow compiles the C reference of the proof of work
# (pow/ref), the only copy of that code. neb-codec, neb-block and neb-difficulty
# are consensus primitives; neb-chain holds the rules and builds on them.
[workspace]
members = ["crates/neb-codec", "crates/neb-block", "crates/neb-difficulty", "crates/neb-pow", "crates/neb-engines", "crates/neb-chain", "crates/neb-work", "crates/neb-store", "crates/neb-json", "crates/neb-wallet", "crates/neb-node", "crates/neb-cpuminer", "crates/neb-gpuminer", "crates/neb-metalminer"]
resolver = "3"

# Shared by all member crates.
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

# Every unsafe block states why it is sound (a `// SAFETY:` comment); CI runs clippy with warnings as errors.
[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[package]
name = "neb-wallet"
description = "Command-line wallet for NEB: keys, addresses, coin selection and signing."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "neb-wallet"
path = "src/main.rs"

[dependencies]
neb-chain = { path = "../neb-chain" }
neb-json = { path = "../neb-json" }
ed25519-dalek = "3"
blake3 = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
argon2 = "0.6"
chacha20poly1305 = "0.11"
rpassword = "7"

[dev-dependencies]
neb-node = { path = "../neb-node" }

[lints]
workspace = true
